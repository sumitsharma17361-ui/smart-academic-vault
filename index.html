<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMGI Student Academic Portal & AI Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }

        /* Header / College Portal Navigation */
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 24px; }
        .portal-title h1 { font-size: 18px; color: #f1f5f9; font-weight: 700; }
        .portal-title p { font-size: 12px; color: #94a3b8; }
        .user-badge { background: #3b82f6; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        /* Main Container */
        .container { max-width: 900px; margin: 20px auto; width: 95%; flex: 1; display: flex; flex-direction: column; gap: 15px; }

        /* Chat Window (Gemini Style) */
        .chat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; display: flex; flex-direction: column; height: 70vh; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .chat-header { padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { font-size: 15px; color: #60a5fa; display: flex; align-items: center; gap: 8px; }
        .clear-btn { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .clear-btn:hover { background: #334155; color: #fff; }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* Message Bubbles */
        .message { display: flex; flex-direction: column; max-width: 80%; animation: fadeIn 0.2s ease-in-out; }
        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }

        .bubble { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .message.user .bubble { background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
        .message.assistant .bubble { background: #334155; color: #f1f5f9; border-bottom-left-radius: 2px; border: 1px solid #475569; }

        .sender-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .message.user .sender-label { text-align: right; }

        /* Chat Input Area */
        .chat-input-area { padding: 15px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; }
        .chat-input-area textarea { flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; resize: none; height: 48px; outline: none; }
        .chat-input-area textarea:focus { border-color: #3b82f6; }
        .send-btn { background: #2563eb; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .send-btn:hover { background: #1d4ed8; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <span class="logo-icon">🎓</span>
            <div class="portal-title">
                <h1>BMGI Vault Portal</h1>
                <p>BM Group of Institutions • Computer Science Dept.</p>
            </div>
        </div>
        <div class="user-badge">CSE / Sem 5</div>
    </header>

    <div class="container">
        <div class="chat-card">
            <div class="chat-header">
                <h3>🧠 Grok AI Tutor</h3>
                <button class="clear-btn" onclick="clearMemory()">Reset Chat</button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <span class="sender-label">BMGI AI Assistant</span>
                    <div class="bubble">Hello! I am your AI Academic Assistant. Ask me anything about your Semester 5 subjects, code debugging, or exam preparations!</div>
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="userInput" placeholder="Ask a question..." onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Store conversation memory array
        let chatHistory = [];
        const BACKEND_URL = "https://smart-academic-vault.onrender.com/api/ai-assistant"; // Replace with your actual Render URL if different

        function appendMessage(role, text) {
            const chatContainer = document.getElementById("chatMessages");
            
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${role}`;

            const label = document.createElement("span");
            label.className = "sender-label";
            label.innerText = role === "user" ? "You" : "BMGI AI Assistant";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerText = text;

            msgDiv.appendChild(label);
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);

            // Auto-scroll to bottom like Gemini
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const inputElem = document.getElementById("userInput");
            const prompt = inputElem.value.trim();

            if (!prompt) return;

            // 1. Show User message & clear input immediately
            appendMessage("user", prompt);
            inputElem.value = "";

            // 2. Add user prompt to conversation memory
            chatHistory.push({ role: "user", content: prompt });

            // 3. Temporary Loading state
            const loadingText = "Typing...";
            appendMessage("assistant", loadingText);
            const chatContainer = document.getElementById("chatMessages");
            const loadingElem = chatContainer.lastElementChild;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: prompt,
                        history: chatHistory
                    })
                });

                const data = await response.json();
                const aiReply = data.result || "Could not retrieve answer.";

                // Update Loading message with real response
                loadingElem.querySelector(".bubble").innerText = aiReply;

                // Add assistant reply to memory
                chatHistory.push({ role: "assistant", content: aiReply });

            } catch (err) {
                loadingElem.querySelector(".bubble").innerText = "Error connecting to server. Please try again.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function clearMemory() {
            chatHistory = [];
            document.getElementById("chatMessages").innerHTML = `
                <div class="message assistant">
                    <span class="sender-label">BMGI AI Assistant</span>
                    <div class="bubble">Chat history cleared! What would you like to discuss next?</div>
                </div>
            `;
        }
    </script>
</body>
</html>
