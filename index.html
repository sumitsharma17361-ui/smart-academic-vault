<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academic Vault & AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-400"><i class="fa-solid fa-graduation-cap mr-2"></i>Campus Vault</h1>
        <span class="text-xs bg-indigo-600 px-2 py-1 rounded-full">CSE / Semester 4</span>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-800 bg-gray-800/50">
        <button id="tab-vault" onclick="switchTab('vault')" class="flex-1 py-3 text-center border-b-2 border-indigo-500 font-semibold text-indigo-400">
            <i class="fa-solid fa-book-open mr-1"></i> Notes Vault
        </button>
        <button id="tab-ai" onclick="switchTab('ai')" class="flex-1 py-3 text-center border-b-2 border-transparent text-gray-400">
            <i class="fa-solid fa-robot mr-1"></i> AI Assistant
        </button>
    </div>

    <!-- Main Content Area -->
    <main class="p-4 max-w-2xl mx-auto">

        <!-- Vault Section -->
        <section id="vault-section" class="space-y-4">
            <!-- Filter Options -->
            <div class="flex gap-2">
                <select id="subject-filter" class="bg-gray-800 border border-gray-700 p-2 rounded-lg flex-1 text-sm text-gray-200">
                    <option value="all">All Subjects</option>
                    <option value="os">Operating Systems</option>
                    <option value="dbms">DBMS</option>
                    <option value="algo">Algorithms</option>
                </select>
                <button onclick="fetchNotes()" class="bg-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Filter</button>
            </div>

            <!-- Notes List Container -->
            <div id="notes-container" class="space-y-3">
                <p class="text-xs text-gray-400 text-center py-4">Loading notes...</p>
            </div>
        </section>

        <!-- AI Assistant Section -->
        <section id="ai-section" class="hidden space-y-4">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <h2 class="font-bold text-lg mb-2 text-indigo-400"><i class="fa-solid fa-brain mr-2"></i>Academic AI Summarizer</h2>
                <p class="text-xs text-gray-400 mb-4">Paste syllabus topic or complex academic question to get simplified explanation.</p>
                
                <textarea id="ai-input" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg text-sm focus:outline-none focus:border-indigo-500 h-28" placeholder="Type your academic doubt here..."></textarea>
                
                <button onclick="askAI()" id="ai-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2.5 rounded-lg font-semibold mt-3 text-sm flex justify-center items-center gap-2">
                    <span>Ask AI Assistant</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

            <!-- AI Response Display Box -->
            <div id="ai-output" class="hidden bg-gray-800/80 p-4 rounded-xl border border-indigo-500/30 space-y-2">
                <h3 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">AI Answer:</h3>
                <div id="ai-response-text" class="text-sm text-gray-200 leading-relaxed whitespace-pre-line"></div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
